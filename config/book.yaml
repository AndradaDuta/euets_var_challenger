# Book definition and model settings.
# The book is HYPOTHETICAL. Positions are in EUR notional and rebalanced daily
# to constant notional (see README, decision log).

group: GROUP
base_currency: EUR

instruments:
  EUA:
    currency: EUR
    lot_size_t: 1000          # ICE EUA futures: 1 lot = 1,000 t CO2
    description: ICE EUA futures, nearest-contract continuous (not a pure December series; see SOURCES.md)
  UKA:
    currency: GBP
    lot_size_t: 1000          # ICE UKA futures: 1 lot = 1,000 t CO2
    description: ICE UKA futures, front-month continuous
  TTF:
    currency: EUR
    lot_size_t: null          # gas, not carbon: no tonne-based open-position limit
    description: ICE Endex Dutch TTF front-month futures, continuous

fx_pairs:
  - EURGBP                    # GBP per 1 EUR (ECB reference rate)

books:
  EUA_OUTRIGHT:
    desk: COMPLIANCE
    positions:
      EUA: 20000000
  EUA_UKA_SPREAD:
    desk: TRADING
    positions:
      EUA: 10000000
      UKA: -10000000
  CARBON_GAS_RV:
    desk: TRADING
    positions:
      TTF: -5000000

sample:
  data_start: 2015-01-01
  data_end: 2026-09-25               # sample frozen for all series (decision log, 2026-10-11)
  eua_eval_start: 2019-01-01         # MSR operational
  full_book_eval_start: null         # computed from data by the pipeline, never typed in by hand

# Raw files and cleaning rules. Raw rows are loaded into DuckDB untouched;
# everything below is applied afterwards, when returns are computed.
data:
  raw_dir: data/raw
  reference_instrument: EUA          # the calendar is anchored on EUA trading days (BUILD_SPEC, Section 2)
  prices:
    EUA:
      file: eua_investing.csv
      format: investing
      source: Investing.com, Carbon Emissions Futures
    UKA:
      file: uka_investing.csv
      format: investing
      source: Investing.com, UK Emissions Allowances (c1)
    TTF:
      file: ttf_front_investing.csv
      format: investing
      source: Investing.com, Dutch TTF Natural Gas Futures
  fx:
    EURGBP:                          # GBP per 1 EUR (ECB convention)
      file: eurgbp_ecb.csv
      format: ecb
  msr_events:
    file: msr_events.csv

  # Placeholder rows printed by the source on exchange holidays: open = high = low = close,
  # no volume, price unchanged from the previous day. Dropped before returns are computed.
  stale_rows:
    EUA: [2015-04-06, 2016-08-29, 2019-12-26, 2021-04-05]

  # Days on which the source series switches from one futures contract to another.
  # The return on such a day compares two different contracts, so it is removed for the
  # whole book. Identified from volume regime changes (see SOURCES.md); the December
  # dates are accurate to within a day.
  excluded_returns:
    EUA:
      - 2022-12-19
      - 2023-03-27
      - 2023-12-18
      - 2024-01-15
      - 2024-12-10
      - 2025-06-23
      - 2025-12-15
      - 2026-06-22

risk:
  var_confidence: [0.99, 0.975]
  es_confidence: [0.975]

models:
  hs:
    window: 250
    quantile_method: linear          # np.quantile(..., method="linear")
  fhs:
    model: GJR-GARCH(1,1)
    innovations: student-t
    refit_every: 21
    min_obs: 750
    residual_window: 750
  ewma:
    lambda: 0.94
    variants: [normal, student-t]    # t degrees of freedom taken from the FHS fit
  qrnn:
    taus: [0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.0175, 0.02, 0.0225, 0.025]
    hidden_units: [32, 16]
    dropout: 0.1
    weight_decay: 1.0e-4
    refit_every: 21
    min_obs: 750
    early_stopping_fraction: 0.2     # last 20% of the training window, in time order
    n_seeds: 10
    msr_days_since_cap: 60
    msr_recent_window: 5
