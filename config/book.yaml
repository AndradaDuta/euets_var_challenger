# Book definition and model settings.
# The book is HYPOTHETICAL. Positions are in EUR notional and rebalanced daily
# to constant notional (see README, decision log).

group: GROUP
base_currency: EUR

instruments:
  EUA:
    currency: EUR
    lot_size_t: 1000          # ICE EUA futures: 1 lot = 1,000 t CO2
    description: ICE EUA futures, nearest-contract continuous (not a pure December series; see SOURCES.md)
  UKA:
    currency: GBP
    lot_size_t: 1000          # ICE UKA futures: 1 lot = 1,000 t CO2
    description: ICE UKA futures, front-month continuous
  TTF:
    currency: EUR
    lot_size_t: null          # gas, not carbon: no tonne-based open-position limit
    description: ICE Endex Dutch TTF front-month futures, continuous

fx_pairs:
  - EURGBP                    # GBP per 1 EUR (ECB reference rate)

books:
  EUA_OUTRIGHT:
    desk: COMPLIANCE
    positions:
      EUA: 20000000
  EUA_UKA_SPREAD:
    desk: TRADING
    positions:
      EUA: 10000000
      UKA: -10000000
  CARBON_GAS_RV:
    desk: TRADING
    positions:
      TTF: -5000000

sample:
  data_start: 2015-01-01
  data_end: 2026-09-25               # sample frozen for all series (decision log, 2026-10-11)
  eua_eval_start: 2019-01-01         # MSR operational
  full_book_eval_start: null         # computed from data by the pipeline, never typed in by hand

# Raw files and cleaning rules. Raw rows are loaded into DuckDB untouched;
# everything below is applied afterwards, when returns are computed.
data:
  raw_dir: data/raw
  reference_instrument: EUA          # the calendar is anchored on EUA trading days (BUILD_SPEC, Section 2)
  prices:
    EUA:
      file: eua_investing.csv
      format: investing
      source: Investing.com, Carbon Emissions Futures
    UKA:
      file: uka_investing.csv
      format: investing
      source: Investing.com, UK Emissions Allowances (c1)
    TTF:
      file: ttf_front_investing.csv
      format: investing
      source: Investing.com, Dutch TTF Natural Gas Futures
  fx:
    EURGBP:                          # GBP per 1 EUR (ECB convention)
      file: eurgbp_ecb.csv
      format: ecb
  msr_events:
    file: msr_events.csv

  # Placeholder rows printed by the source on exchange holidays: open = high = low = close,
  # no volume, price unchanged from the previous day. Dropped before returns are computed.
  stale_rows:
    EUA: [2015-04-06, 2016-08-29, 2019-12-26, 2021-04-05]
    TTF: [2015-05-04, 2023-04-10]

  # Days on which a source series switches from one futures contract to another.
  # The return on such a day compares two different contracts, so it is removed for that
  # risk factor and every node exposed to it has no P&L that day.
  #
  # EUA: irregular switch dates, identified from volume regime changes (see SOURCES.md).
  # The December dates are accurate to within a day.
  excluded_returns:
    EUA:
      - 2022-12-19
      - 2023-03-27
      - 2023-12-18
      - 2024-01-15
      - 2024-12-10
      - 2025-06-23
      - 2025-12-15
      - 2026-06-22

  # TTF: a front-month series switches contract on a known schedule, so the dates are
  # computed from a rule instead of being listed. ICE Endex TTF futures stop trading two
  # UK business days before the first calendar day of the delivery month; the switch shows
  # in the return of the next trading day.
  roll_returns:
    TTF:
      rule: front_month
      business_days_before_delivery: 2

  # England and Wales bank holidays falling on a weekday, 2015 to 2026. Used only to find
  # the TTF expiry dates above.
  uk_bank_holidays:
    - [2015-01-01, 2015-04-03, 2015-04-06, 2015-05-04, 2015-05-25, 2015-08-31, 2015-12-25, 2015-12-28]
    - [2016-01-01, 2016-03-25, 2016-03-28, 2016-05-02, 2016-05-30, 2016-08-29, 2016-12-26, 2016-12-27]
    - [2017-01-02, 2017-04-14, 2017-04-17, 2017-05-01, 2017-05-29, 2017-08-28, 2017-12-25, 2017-12-26]
    - [2018-01-01, 2018-03-30, 2018-04-02, 2018-05-07, 2018-05-28, 2018-08-27, 2018-12-25, 2018-12-26]
    - [2019-01-01, 2019-04-19, 2019-04-22, 2019-05-06, 2019-05-27, 2019-08-26, 2019-12-25, 2019-12-26]
    - [2020-01-01, 2020-04-10, 2020-04-13, 2020-05-08, 2020-05-25, 2020-08-31, 2020-12-25, 2020-12-28]
    - [2021-01-01, 2021-04-02, 2021-04-05, 2021-05-03, 2021-05-31, 2021-08-30, 2021-12-27, 2021-12-28]
    - [2022-01-03, 2022-04-15, 2022-04-18, 2022-05-02, 2022-06-02, 2022-06-03, 2022-08-29, 2022-09-19, 2022-12-26, 2022-12-27]
    - [2023-01-02, 2023-04-07, 2023-04-10, 2023-05-01, 2023-05-08, 2023-05-29, 2023-08-28, 2023-12-25, 2023-12-26]
    - [2024-01-01, 2024-03-29, 2024-04-01, 2024-05-06, 2024-05-27, 2024-08-26, 2024-12-25, 2024-12-26]
    - [2025-01-01, 2025-04-18, 2025-04-21, 2025-05-05, 2025-05-26, 2025-08-25, 2025-12-25, 2025-12-26]
    - [2026-01-01, 2026-04-03, 2026-04-06, 2026-05-04, 2026-05-25, 2026-08-31, 2026-12-25, 2026-12-28]

risk:
  var_confidence: [0.99, 0.975]
  es_confidence: [0.975]

models:
  hs:
    window: 250
    quantile_method: linear          # np.quantile(..., method="linear")
  fhs:
    model: GJR-GARCH(1,1)
    innovations: student-t
    refit_every: 21
    min_obs: 750
    residual_window: 750
  ewma:
    lambda: 0.94
    variants: [normal, student-t]    # t degrees of freedom taken from the FHS fit
  qrnn:
    taus: [0.0025, 0.005, 0.0075, 0.01, 0.0125, 0.015, 0.0175, 0.02, 0.0225, 0.025]
    hidden_units: [32, 16]
    dropout: 0.1
    weight_decay: 1.0e-4
    refit_every: 21
    min_obs: 750
    early_stopping_fraction: 0.2     # last 20% of the training window, in time order
    n_seeds: 10
    msr_days_since_cap: 60
    msr_recent_window: 5
